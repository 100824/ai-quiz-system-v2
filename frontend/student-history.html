<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人工智能学习平台 - 历史答题记录</title>
  <link rel="stylesheet" href="./v2/css/tokens.css?v=2026061910">
  <link rel="stylesheet" href="./v2/css/app.css?v=2026073101">
</head>
<body class="history-page">
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1>我的历史课堂答题数据</h1>
        <p id="historySubtitle" class="history-subtitle">正在加载...</p>
      </div>
      <nav class="nav-pills" style="display:flex;">
        <a href="./student.html">返回学生端登录口</a>
      </nav>
    </header>

    <!-- 汇总统计 -->
    <div id="historySummary" class="history-summary hidden"></div>

    <!-- 预测分数对比 -->
    <div id="historyScoreCompare" class="history-score-compare hidden"></div>

    <!-- 加载中 -->
    <section id="historyLoading" class="panel">
      <div class="empty">⏳ 正在加载历史答题数据...</div>
    </section>

    <!-- 空状态 -->
    <section id="historyEmpty" class="panel hidden">
      <div class="empty">
        <div style="font-size: 32px; margin-bottom: 12px;">📚</div>
        <p>当前还没有可查看的历史课堂答题数据。</p>
      </div>
    </section>
  </main>
  <script type="module" src="./v2/js/history/app.js?v=2026073101"></script>
</body>
</html>
